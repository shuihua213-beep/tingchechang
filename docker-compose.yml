services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CF_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${CF_MYSQL_DATABASE}
      MYSQL_USER: ${CF_MYSQL_USERNAME}
      MYSQL_PASSWORD: ${CF_MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./caifeng.sql:/docker-entrypoint-initdb.d/01-caifeng.sql:ro

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:4.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CF_MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CF_MONGODB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  zookeeper:
    image: zookeeper:3.8
    restart: unless-stopped
    ports:
      - "2181:2181"

  fastdfs-tracker:
    image: ygqygq2/fastdfs-nginx:latest
    restart: unless-stopped
    command: tracker
    ports:
      - "22122:22122"
    volumes:
      - fastdfs-tracker-data:/var/fdfs

  fastdfs-storage:
    image: ygqygq2/fastdfs-nginx:latest
    restart: unless-stopped
    command: storage
    environment:
      TRACKER_SERVER: fastdfs-tracker:22122
    ports:
      - "23000:23000"
      - "8888:8080"
    volumes:
      - fastdfs-storage-data:/var/fdfs
    depends_on:
      - fastdfs-tracker

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CF_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CF_MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  app:
    image: maven:3.8.8-eclipse-temurin-8
    restart: unless-stopped
    working_dir: /workspace
    environment:
      CF_LOAD_DOTENV: "true"
    ports:
      - "8070:8070"
      - "8071:8071"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
      - "8089:8089"
      - "8090:8090"
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8094:8094"
      - "8095:8095"
      - "8096:8096"
      - "8097:8097"
      - "8098:8098"
      - "8099:8099"
      - "8100:8100"
      - "8101:8101"
      - "8102:8102"
      - "8103:8103"
      - "8104:8104"
      - "8105:8105"
      - "8106:8106"
    volumes:
      - ./:/workspace
      - maven-repo:/root/.m2
    depends_on:
      - mysql
      - redis
      - mongodb
      - zookeeper
      - fastdfs-tracker
      - fastdfs-storage
      - minio
    command: >
      bash -lc "chmod +x /workspace/package.sh /workspace/start.sh /workspace/replace.sh && /workspace/package.sh && /workspace/start.sh && tail -f /dev/null"

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  fastdfs-tracker-data:
  fastdfs-storage-data:
  minio-data:
  maven-repo:
