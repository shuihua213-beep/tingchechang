server:
  port: 8081
spring:
  application:
    name: cf-ucenter-service
  datasource:
    name: ${cf.env.mysql.database}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${cf.env.mysql.url}
    username: ${cf.env.mysql.username}
    password: ${cf.env.mysql.password}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32
  redis:
    host: ${cf.env.redis.host}
    port: ${cf.env.redis.port}
    password: ${cf.env.redis.password}
    database: ${cf.env.redis.database}
    jedis:
      pool:
        maxActive: 20
        maxIdle: 20
        minIdle: 10
        maxWait: -1
mybatis:
  mapperLocations: classpath:com.cf.ucenter.dao.mapper/*.xml
  configLocation: classpath:config/SqlMapConfig.xml
dubbo:
  scan:
    base-packages: com.cf.ucenter.service.impl
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: 20881
    threads: 200
    accepts: 0
  registry:
    address: ${cf.env.dubbo.registry-address}
  provider.filter: -exception
cf:
  getIpUrl: https://park.cfeng.wang/ip
logistics:
  tms-url: ""
