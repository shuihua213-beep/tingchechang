server:
  port: 8082
  servlet:
    context-path: /auth
spring:
  application:
    name: cf-ucenter-auth
  redis:
    host: ${cf.env.redis.host}
    port: ${cf.env.redis.port}
    password: ${cf.env.redis.password}
    database: ${cf.env.redis.database}
    jedis:
      pool:
        maxActive: 20
        maxIdle: 20
        minIdle: 10
        maxWait: -1
  datasource:
    name: ${cf.env.mysql.database}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${cf.env.mysql.url}
    username: ${cf.env.mysql.username}
    password: ${cf.env.mysql.password}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32
    druid:
      url: ${cf.env.mysql.url}
      username: ${cf.env.mysql.username}
      password: ${cf.env.mysql.password}
      driverClassName: com.mysql.jdbc.Driver
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 10000
      testOnBorrow: true
      testOnReturn: false
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
auth:
  tokenValiditySeconds: ${cf.env.auth.token-validity-seconds}
  clientId: ${cf.env.auth.client-id}
  clientSecret: ${cf.env.auth.client-secret}
  cookieDomain: ${cf.env.auth.cookie-domain}
  cookieMaxAge: ${cf.env.auth.cookie-max-age}
encrypt:
  key-store:
    location: classpath:/xc.keystore
    secret: xuechengkeystore
    alias: xckey
    password: xuecheng
dubbo:
  scan:
    base-packages: com.cf.ucenter.auth.service
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: ${cf.env.dubbo.registry-address}
  provider:
    filter: -exception
