server:
  port: 8082
  servlet:
    context-path: /auth
spring:
  application:
    name: cf-ucenter-auth
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    jedis:
      pool:
        maxActive: 20
        maxIdle: 20
        minIdle: 10
        maxWait: -1
  datasource:
    name: caifeng
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:caifeng}?characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&useSSL=false
    username: ${MYSQL_USER:caifeng}
    password: ${MYSQL_PASSWORD:caifeng}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32
    druid:
      url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:caifeng}?characterEncoding=utf-8&useSSL=false}
      username: ${MYSQL_USER:caifeng}
      password: ${MYSQL_PASSWORD:caifeng}
      driverClassName: com.mysql.jdbc.Driver
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 10000
      testOnBorrow: true
      testOnReturn: false
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
auth:
  tokenValiditySeconds: ${AUTH_TOKEN_VALIDITY_SECONDS:1200}
  clientId: ${AUTH_CLIENT_ID:oauth2_client_id}
  clientSecret: ${AUTH_CLIENT_SECRET:oauth2_client_secret}
  cookieDomain: ${AUTH_COOKIE_DOMAIN:xuecheng.com}
  cookieMaxAge: ${AUTH_COOKIE_MAX_AGE:-1}
encrypt:
  key-store:
    location: ${ENCRYPT_KEYSTORE_LOCATION:classpath:/xc.keystore}
    secret: ${ENCRYPT_KEYSTORE_SECRET:xuechengkeystore}
    alias: ${ENCRYPT_KEYSTORE_ALIAS:xckey}
    password: ${ENCRYPT_KEYSTORE_PASSWORD:xuecheng}

dubbo:
  scan:
    base-packages: com.cf.ucenter.auth.service
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: zookeeper://${ZK_HOST:127.0.0.1}:${ZK_PORT:2181}
  provider:
    filter: -exception
