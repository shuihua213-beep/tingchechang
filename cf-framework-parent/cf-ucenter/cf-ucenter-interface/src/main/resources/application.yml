#默认使用配置
spring:
  profiles:
    active: dev
  datasource:
    name: caifeng
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:caifeng}?characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&useSSL=false
    username: ${MYSQL_USER:caifeng}
    password: ${MYSQL_PASSWORD:caifeng}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32

#公共配置与profiles选择无关
mybatis:
#  mapperScanPackage: com.cf.mapper
#  typeAliasesPackage: com.cf.pojo
  mapperLocations: classpath:com.cf.ucenter.dao.mapper/*.xml
  configLocation: classpath:config/SqlMapConfig.xml
