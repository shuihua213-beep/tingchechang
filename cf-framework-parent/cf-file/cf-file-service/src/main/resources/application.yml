server:
  port: 8087
spring:
  application:
    name: cf-file-service
  datasource:
    name: ${cf.env.mysql.database}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${cf.env.mysql.url}
    username: ${cf.env.mysql.username}
    password: ${cf.env.mysql.password}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32
  data:
    mongodb:
      uri: ${cf.env.mongodb.uri}
      database: ${cf.env.mongodb.database}
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0
      location:
      max-file-size: 1MB
      max-request-size: 30MB
  redis:
    host: ${cf.env.redis.host}
    port: ${cf.env.redis.port}
    password: ${cf.env.redis.password}
    database: ${cf.env.redis.database}
    jedis:
      pool:
        maxActive: 3
        maxIdle: 3
        minIdle: 1
        maxWait: -1
mybatis:
  mapperLocations: classpath:com.cf.chat.dao.mapper/*.xml
  configLocation: classpath:config/SqlMapConfig.xml
dubbo:
  scan:
    base-packages: com.cf.file.service.impl
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: 20887
    threads: 200
    accepts: 0
  registry:
    address: ${cf.env.dubbo.registry-address}
  provider.filter: -exception
cf:
  fastdfs:
    connect_timeout_in_seconds: 5
    network_timeout_in_seconds: 30
    charset: UTF-8
    tracker_servers: ${cf.env.fastdfs.tracker-servers}
