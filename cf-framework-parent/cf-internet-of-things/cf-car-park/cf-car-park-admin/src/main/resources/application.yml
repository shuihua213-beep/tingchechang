server:
  port: 8092
  max-http-header-size: 64KB
spring:
  application:
    name: cf-carpark-admin
  datasource:
    name: ${cf.env.mysql.database}
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${cf.env.mysql.url}
    username: ${cf.env.mysql.username}
    password: ${cf.env.mysql.password}
    driver-class-name: com.mysql.jdbc.Driver
    maxActive: 32
  redis:
    host: ${cf.env.redis.host}
    port: ${cf.env.redis.port}
    password: ${cf.env.redis.password}
    database: ${cf.env.redis.database}
    jedis:
      pool:
        maxActive: 3
        maxIdle: 3
        minIdle: 1
        maxWait: -1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: /home/app/tomcat_upload_temp
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: ${cf.env.dubbo.registry-address}
auth:
  tokenValiditySeconds: ${cf.env.auth.token-validity-seconds}
  clientId: ${cf.env.auth.client-id}
  clientSecret: ${cf.env.auth.client-secret}
  cookieDomain: ${cf.env.auth.cookie-domain}
  cookieMaxAge: ${cf.env.auth.cookie-max-age}
